{% extends "base.html" %}
{% block title %}{{ 'Edit review' if review_id else 'New review' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit review %s'|format(review_id) if review_id else 'New review' }}</h1>
<form class="card" method="post">
  <div class="grid">
    <div><label>Paper</label>
      <select name="paper_id" required><option value="">— choose —</option>
        {% for p in papers %}<option value="{{ p.id }}" {% if form.get('paper_id')|string == p.id|string %}selected{% endif %}>{{ p.label }}</option>{% endfor %}
      </select></div>
    <div><label>Reviewer</label>
      <select name="reviewer_id" required><option value="">— choose —</option>
        {% for r in reviewers %}<option value="{{ r.id }}" {% if form.get('reviewer_id')|string == r.id|string %}selected{% endif %}>{{ r.name }} (pools: {{ r.pools }})</option>{% endfor %}
      </select></div>
    <div><label>Overall score (1-5)</label>
      <select name="overall_score" required><option value="">—</option>
        {% for s in range(1, 6) %}<option value="{{ s }}" {% if form.get('overall_score')|string == s|string %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select></div>
    <div><label>Recommendation</label>
      <select name="recommendation" required><option value="">—</option>
        {% for r in recommendations %}<option value="{{ r }}" {% if form.get('recommendation') == r %}selected{% endif %}>{{ r }}</option>{% endfor %}
      </select></div>
    <div><label>Submission date</label><input type="date" name="review_submission_date" value="{{ form.get('review_submission_date', '') }}" required></div>
  </div>
  <label>Comments for authors</label><textarea name="comments_for_authors" required>{{ form.get('comments_for_authors', '') }}</textarea>
  <label>Confidential comments <span class="hint">(optional, for the committee only)</span></label>
  <textarea name="confidential_comments">{{ form.get('confidential_comments', '') }}</textarea>
  <div class="actions"><button type="submit">Save review</button>
    <a class="btn light" href="{{ url_for('reviews_list') }}">Cancel</a></div>
</form>
{% endblock %}
