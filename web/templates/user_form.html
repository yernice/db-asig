{% extends "base.html" %}
{% block title %}{{ 'Edit user' if user_id else 'New user' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit user %s'|format(user_id) if user_id else 'New user' }}</h1>
<form class="card" method="post">
  <div class="grid">
    <div><label>Given name</label><input type="text" name="given_name" value="{{ form.get('given_name', '') }}" required></div>
    <div><label>Surname</label><input type="text" name="surname" value="{{ form.get('surname', '') }}" required></div>
    <div><label>Email <span class="hint">(unique)</span></label><input type="email" name="email" value="{{ form.get('email', '') }}" required></div>
    <div><label>Phone number</label><input type="text" name="phone_number" value="{{ form.get('phone_number', '') }}" required></div>
    <div><label>Affiliation</label><input type="text" name="affiliation" value="{{ form.get('affiliation', '') }}" required></div>
    <div><label>Country</label><input type="text" name="country" value="{{ form.get('country', '') }}" required></div>
  </div>
  <p class="hint">Every user needs at least one role.</p>
  <div class="grid">
    <div class="card">
      <label><input type="checkbox" name="is_author" {% if form.get('is_author') %}checked{% endif %}> Author</label>
      <label>ORCID <span class="hint">(optional, e.g. 0000-0002-1825-0097)</span></label>
      <input type="text" name="orcid" value="{{ form.get('orcid', '') }}">
      <label>Research areas <span class="hint">(one per line)</span></label>
      <textarea name="research_areas">{{ form.get('research_areas', '') }}</textarea>
    </div>
    <div class="card">
      <label><input type="checkbox" name="is_reviewer" {% if form.get('is_reviewer') %}checked{% endif %}> Reviewer</label>
      <label>Years of reviewing experience</label>
      <input type="number" name="years_experience" value="{{ form.get('years_experience', '') }}">
      <label>Expertise areas <span class="hint">(one per line)</span></label>
      <textarea name="expertise">{{ form.get('expertise', '') }}</textarea>
    </div>
  </div>
  <div class="actions"><button type="submit">Save</button>
    <a class="btn light" href="{{ url_for('user_detail', user_id=user_id) if user_id else url_for('users_list') }}">Cancel</a></div>
</form>
{% endblock %}
